name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ai-loading-catch-up-extension
          path: |
            dist/ai-loading-catch-up-unpacked
            dist/ai-loading-catch-up-chrome.zip
